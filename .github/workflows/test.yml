name: Go Toolchain Tests
on:
  pull_request:
  push:
    branches:
      - cf
      - '*/cf-**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
          cache: false
      - name: Verify Environment
        run: |
          echo "Checking bash location..."
          ls -l /bin/bash || echo "/bin/bash not found"
          which bash || echo "bash not in PATH"
          bash --version || echo "bash not executable"
          echo "Current PATH: $PATH"
          go version
          go env GOROOT
          go env GOTOOLCHAIN
          go env GOENV
      - name: Fix PATH and Run tests
        env:
          GOROOT: /opt/hostedtoolcache/go/1.23.7/x64
          PATH: /bin:/usr/bin:/opt/hostedtoolcache/go/1.23.7/x64/bin:$PATH
          GOTOOLCHAIN: go1.23.7
          GOENV: off
        run: |
          echo "Updated PATH: $PATH"
          bash --version  # Verify bash works
          bash ./all.bash
        working-directory: src