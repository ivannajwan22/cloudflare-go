name: Go Toolchain Tests
on:
  pull_request:
  push:
    branches:
      - cf
      - '*/cf-**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
          cache: false
      - name: Verify Environment
        run: |
          echo "Checking bash location..."
          which bash || echo "bash not found"
          bash --version || echo "bash not available"
          go version
          go env GOROOT
          go env GOTOOLCHAIN
          go env GOENV
          echo "PATH=$PATH"
      - name: Run tests
        env:
          GOROOT: /opt/hostedtoolcache/go/1.23.7/x64
          PATH: /opt/hostedtoolcache/go/1.23.7/x64/bin:$PATH
          GOTOOLCHAIN: go1.23.7
          GOENV: off
        run: bash ./all.bash  # Explicitly call with bash
        working-directory: src