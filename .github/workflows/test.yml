name: Go Toolchain Tests
on:
  pull_request:
  push:
    branches:
      - cf
      - '*/cf-**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout kode dari repositori
      - uses: actions/checkout@v4

      # Setup Go toolchain
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # Versi Go yang kompatibel

      # Atur variabel lingkungan untuk GOPATH
      - name: Configure Go environment
        run: |
          echo "GOPATH=/home/runner/go" >> $GITHUB_ENV
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      # Debug: Tampilkan isi direktori dan lingkungan
      - name: Debug environment
        run: |
          go version
          go env
          ls -l .

      # Jalankan tes Go standar
      - name: Run tests
        run: go test ./... -v
